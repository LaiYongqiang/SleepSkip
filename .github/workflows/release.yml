name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release channel
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          source scripts/release_metadata.sh
          sleepskip_release_metadata "${RELEASE_TAG#v}" "$GITHUB_RUN_NUMBER"
          echo "prerelease=$SLEEPSKIP_PRERELEASE" >> "$GITHUB_OUTPUT"
          bash scripts/verify_release.sh

      - name: Run unit and lifecycle tests
        run: swift test

      - name: Run verification suite
        run: |
          chmod +x scripts/verify.sh
          ./scripts/verify.sh

      - name: Build release bundle, ZIP, and DMG
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          CLEAN_VERSION="${VERSION#v}"
          chmod +x scripts/build_app.sh
          VERSION="$CLEAN_VERSION" ./scripts/build_app.sh
          (cd dist && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt)

      - name: Enforce idle power release gate
        run: |
          chmod +x scripts/bench_gate.sh
          ./scripts/bench_gate.sh dist/SleepSkip.app/Contents/MacOS/SleepSkip

      - name: Verify terminal and CLI lifecycle
        run: SLEEPSKIP_BINARY="$PWD/dist/SleepSkip.app/Contents/MacOS/SleepSkip" python3 scripts/verify_cli.py

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        run: |
          CHANNEL_ARGS=(--latest)
          if [ "$IS_PRERELEASE" = true ]; then CHANNEL_ARGS=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" \
            dist/*.dmg \
            dist/*.zip \
            dist/SHA256SUMS.txt \
            --title "SleepSkip $RELEASE_TAG" \
            --generate-notes "${CHANNEL_ARGS[@]}"

      # Without this, `brew upgrade` would stay pinned to the previous release forever.
      # Requires a TAP_TOKEN secret with write access to LaiYongqiang/homebrew-tap;
      # the step is skipped (not failed) when the secret is absent.
      - name: Sync Homebrew tap
        if: ${{ steps.metadata.outputs.prerelease == 'false' }}
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "Stable tap sync skipped: TAP_TOKEN is not configured."
            exit 0
          fi
          CLEAN_VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 dist/*.dmg | awk '{print $1}')
          TAP_DIR=$(mktemp -d)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/LaiYongqiang/homebrew-tap.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Casks"
          sed -e "s/^  version \".*\"/  version \"${CLEAN_VERSION}\"/" \
              -e "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" \
              Packaging/Homebrew/sleepskip.rb > "$TAP_DIR/Casks/sleepskip.rb"
          git -C "$TAP_DIR" rm -q --ignore-unmatch Casks/sleepguard.rb
          git -C "$TAP_DIR" add Casks/sleepskip.rb
          if git -C "$TAP_DIR" diff --cached --quiet; then exit 0; fi
          git -C "$TAP_DIR" -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "sleepskip ${CLEAN_VERSION}"
          git -C "$TAP_DIR" push
