name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Swift Testing suite
        run: swift test

      - name: Run verification suite
        run: |
          chmod +x scripts/verify.sh scripts/probe_app_integration.sh
          ./scripts/verify.sh
          ./scripts/probe_app_integration.sh
          bash scripts/verify_release.sh

      - name: Build release .app bundle and DMG
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Enforce idle power gate
        run: |
          chmod +x scripts/bench_gate.sh
          COMPARE_BASELINE=1 ./scripts/bench_gate.sh dist/SleepSkip.app/Contents/MacOS/SleepSkip

      - name: Verify terminal and CLI lifecycle
        run: SLEEPSKIP_BINARY="$PWD/dist/SleepSkip.app/Contents/MacOS/SleepSkip" python3 scripts/verify_cli.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SleepSkip-macOS
          path: |
            dist/*.zip
            dist/*.dmg
